# OPT-IN override for the LIVE EXPLORE chat (#187). See docs/DEPLOY.md "Optional: live chat egress".
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.chat-egress.yml up -d
#
# The default stack keeps the api container on internal networks only (no internet). This file attaches it to one
# extra, NON-internal network so it can reach the hosted model providers (OpenRouter, OpenAI, Anthropic) and Tavily.
# Trade-off: the api process then has outbound internet; Blind Replay isolation rests on the code walls and
# services/api/tests/test_explore_separation.py, not on the network. Ollama stays internal-only.
services:
  api:
    environment:
      FAULTLINE_CHAT_EGRESS: ${FAULTLINE_CHAT_EGRESS:-1}
      FAULTLINE_PUBLIC_CHAT: ${FAULTLINE_PUBLIC_CHAT:-}
      FAULTLINE_CHAT_PER_IP: ${FAULTLINE_CHAT_PER_IP:-10}
      FAULTLINE_CHAT_CONCURRENCY: ${FAULTLINE_CHAT_CONCURRENCY:-4}
      FAULTLINE_CHAT_MAX_PRICE_PER_MTOK: ${FAULTLINE_CHAT_MAX_PRICE_PER_MTOK:-20}
      FAULTLINE_CHAT_MODELS: ${FAULTLINE_CHAT_MODELS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    networks: [edge, models, chat-egress]

networks:
  chat-egress:
    internal: false
