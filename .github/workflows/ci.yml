name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: PR commit limit (max 3)
        if: github.event_name == 'pull_request'
        run: |
          n=${{ github.event.pull_request.commits }}
          echo "PR has $n commit(s)"
          if [ "$n" -gt 3 ]; then
            echo "::error::PR has $n commits; the limit is 3. Squash: git reset --soft origin/main, recommit (1-3 commits), git push --force-with-lease"
            exit 1
          fi
      - name: No AI co-author trailers
        if: github.event_name == 'pull_request'
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" \
             | grep -iE '^\s*co-authored-by:.*(claude|anthropic)'; then
            echo "::error::Remove the Co-Authored-By: Claude trailer (git commit --amend), then git push --force-with-lease"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Guard hooks self-test
        run: python3 scripts/test_guardrails.py
      - name: Backend tests
        run: |
          if [ -f services/api/pyproject.toml ]; then
            cd services/api && pip install -e ".[dev]" && python -m pytest -q
          else
            echo "services/api not created yet; skipping"
          fi
      - name: Web typecheck & build
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm ci && npm run typecheck && npm run build
          else
            echo "apps/web not created yet; skipping"
          fi
