name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Guard hooks self-test
        run: python3 scripts/test_guardrails.py
      - name: Backend tests
        run: |
          if [ -f services/api/pyproject.toml ]; then
            cd services/api && pip install -e ".[dev]" && python -m pytest -q
          else
            echo "services/api not created yet; skipping"
          fi
      - name: Web typecheck & build
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm ci && npm run typecheck && npm run build
          else
            echo "apps/web not created yet; skipping"
          fi
