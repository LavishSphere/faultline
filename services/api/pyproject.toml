[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-api"
version = "0.1.0"
description = "FAULTLINE backend: FastAPI service, replay pipeline, deterministic finance engine."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",  # 0.31+: FORWARDED_ALLOW_IPS accepts a CIDR subnet (deploy/docker-compose.yml)
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "httpx>=0.27",
    # LIVE EXPLORE chat (#187): official SDKs, pinned to the majors the adapters are written against.
    "openai>=3.51,<4",  # OpenAI native, and OpenRouter via its OpenAI-compatible base_url
    "anthropic>=2.8,<3",  # Claude: adaptive thinking, server-side fallbacks, refusal stop_reason
    "httpx2>=2.16,<3",  # the SDKs' HTTP client; tests mock providers with httpx2.MockTransport
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

# Flat layout with several top-level packages: list them explicitly so setuptools does not
# try to package data/, var/ or tests/. namespaces=true so a package dir without __init__.py
# (e.g. markets/ while it is being built) is still picked up.
[tool.setuptools]
py-modules = ["main", "models", "config", "errors"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "markets*", "agents*", "routes*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
